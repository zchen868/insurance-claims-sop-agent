<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claims SOP Agent</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --line: #e3e6eb;
  --accent: #2f5bd3; --accent-soft: #e8eefc; --caller: #2f5bd3; --caller-text: #fff;
  --ok: #1f8a4c; --ok-soft: #e4f4ea; --warn: #b26a00; --warn-soft: #fdf1dc; --bad: #c0362c; --bad-soft: #fbe6e4;
  --code: #f1f3f6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1a1e26; --text: #e6e8ec; --muted: #98a1b0; --line: #2b313c;
    --accent: #7c9bff; --accent-soft: #232c45; --caller: #3a5bc7; --caller-text: #fff;
    --ok: #4cc382; --ok-soft: #1c3226; --warn: #f0b350; --warn-soft: #3a2d17; --bad: #ff7b70; --bad-soft: #3d1f1d;
    --code: #222833;
  }
}
* { box-sizing: border-box; }
body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0; font-weight: 650; }
.badge { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
header input, header select { font: inherit; font-size: 13px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
header input { width: 300px; }
button { font: inherit; font-size: 13px; padding: 7px 13px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; font-weight: 600; }
button.ghost { background: transparent; color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; flex: 1; min-height: 0; }
#chatcol { display: flex; flex-direction: column; min-height: 0; }
#log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
.agent { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.caller { align-self: flex-end; background: var(--caller); color: var(--caller-text); border-bottom-right-radius: 4px; }
.meta { font-size: 11px; color: var(--muted); align-self: flex-start; margin-top: -6px; }
.typing { color: var(--muted); font-style: italic; }
#composer { display: flex; gap: 8px; padding: 12px 20px 8px; border-top: 1px solid var(--line); background: var(--panel); }
#composer textarea { flex: 1; resize: none; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); height: 46px; }
#chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 20px 12px; background: var(--panel); }
.chip { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; font-weight: 500; }
.chip:hover { border-color: var(--accent); }
aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 650; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.step { font-size: 11px; text-align: center; padding: 6px 2px; border-radius: 6px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); font-weight: 600; }
.step.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.step.now { background: var(--accent); color: #fff; border-color: transparent; }
.gate { margin-top: 8px; font-size: 13px; padding: 6px 10px; border-radius: 8px; font-weight: 600; }
.gate.closed { background: var(--warn-soft); color: var(--warn); }
.gate.open { background: var(--ok-soft); color: var(--ok); }
.gate.handoff { background: var(--bad-soft); color: var(--bad); }
dl { display: grid; grid-template-columns: 120px 1fr; gap: 3px 10px; margin: 0; font-size: 13px; }
dt { color: var(--muted); }
dd { margin: 0; word-break: break-word; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 5px; background: var(--code); font-family: ui-monospace, Menlo, monospace; }
.tag.llm { background: var(--accent-soft); color: var(--accent); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
ul.trace { margin: 0; padding-left: 16px; font-size: 12px; font-family: ui-monospace, Menlo, monospace; color: var(--muted); }
pre { background: var(--code); padding: 10px; border-radius: 8px; font-size: 12px; white-space: pre-wrap; margin: 0; max-height: 320px; overflow: auto; }
details summary { cursor: pointer; font-size: 13px; color: var(--accent); }
.empty { font-size: 13px; color: var(--muted); }
@media (max-width: 900px) {
  body { height: auto; }
  main { grid-template-columns: 1fr; }
  #chatcol { height: 75vh; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  header input { width: 100%; }
  .msg { max-width: 92%; }
}
</style>
</head>
<body>
<header>
  <h1>Claims SOP Agent</h1>
  <span class="badge" id="mode">…</span>
  <a href="/chat" target="_blank" style="font-size:13px;color:var(--accent);text-decoration:none;font-weight:600">Open customer view ↗</a>
  <span class="spacer"></span>
  <input id="apikey" type="password" placeholder="Optional: your API key" autocomplete="off">
  <select id="consent" title="Consent scenario for representative callers">
    <option value="default">Consent: approves</option>
    <option value="timeout">Consent: times out</option>
    <option value="link">Consent: real SMS link</option>
  </select>
  <button id="newbtn">New conversation</button>
</header>
<main>
  <section id="chatcol">
    <div id="log" aria-live="polite"></div>
    <div id="composer">
      <textarea id="input" placeholder="Type as the caller… (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send">Send</button>
    </div>
    <div id="chips"></div>
  </section>
  <aside>
    <div>
      <h2>SOP phase</h2>
      <div class="steps" id="steps"></div>
      <div class="gate closed" id="gate">Claim details locked</div>
    </div>
    <div><h2>Memory</h2><dl id="memory"></dl></div>
    <div><h2>Integrations</h2><div class="tags" id="integrations"></div></div>
    <div><h2>Last turn</h2><div id="turn" class="empty">No turns yet.</div></div>
    <div id="outboxwrap" hidden><h2>Email outbox</h2><pre id="outbox"></pre></div>
    <div id="handoffwrap" hidden><h2>Human handoff note</h2><pre id="handoff"></pre></div>
  </aside>
</main>
<script>
const PHASES = ["VERIFY_ID", "RESOLVE_INTENT", "PROCESS_CASE", "POST_PROCESS"];
const SAMPLES = [
  ["Demo test case", "I'm the policyholder. My name is Margaret Chen, policy POL-9921. I'm calling about my denied healthcare claim from January. DOB is 1985-03-15, SSN last four is 4472."],
  ["Hint first", "Hi, I'm calling about my denied healthcare claim from January."],
  ["Frustrated", "I already told you who I am. This is ridiculous. Just tell me why my claim was denied."],
  ["Out of scope", "What is RL?"],
  ["Submit docs?", "How do I submit the documents, and how soon?"],
  ["Missing doc", "What if I can't get the pathology report?"],
  ["Other claim", "What about my auto claim?"],
  ["Done", "No, that's all, thanks."],
  ["Send email", "Yes, please send it."],
  ["Skip email", "No need, skip the email."],
  ["Representative", "My name is David Chen, I'm calling on behalf of my mother Margaret Chen. Her DOB is 1985-03-15, phone 650-521-2836, SSN last four 4472."],
  ["Human please", "Can I talk to a real person?"],
];
let sid = null, busy = false;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function bubble(role, text, meta) {
  const d = document.createElement("div");
  d.className = "msg " + role; d.textContent = text; $("log").appendChild(d);
  if (meta) { const m = document.createElement("div"); m.className = "meta"; m.textContent = meta; $("log").appendChild(m); }
  $("log").scrollTop = $("log").scrollHeight; return d;
}

function render(state, turn) {
  $("mode").textContent = state.mode;
  const mem = state.memory, idx = PHASES.indexOf(mem.phase);
  $("steps").innerHTML = PHASES.map((p, i) => {
    const cls = mem.phase === "ENDED" || i < idx ? "done" : i === idx ? "now" : "";
    return `<div class="step ${cls}">${p.replace("_", " ")}</div>`;
  }).join("");
  const g = $("gate");
  if (mem.phase === "HANDOFF") { g.className = "gate handoff"; g.textContent = "Transferred to a human: " + mem.handoff_reason; }
  else if (mem.gate_open) { g.className = "gate open"; g.textContent = "Verified" + (mem.caller_role === "representative" ? " + consent approved" : "") + ", claim details unlocked"; }
  else { g.className = "gate closed"; g.textContent = mem.verified_party_id ? "Identity OK, waiting on policyholder consent" : "Claim details locked until identity is verified"; }
  const id = Object.entries(mem.identity).filter(([, v]) => v).map(([k]) => k);
  const rows = [
    ["Caller role", mem.caller_role + (mem.rep_name ? ` (${mem.rep_name})` : "")],
    ["Identity heard", id.length ? `<div class="tags">${id.map(k => `<span class="tag">${k}</span>`).join("")}</div>` : "none"],
    ["Verified party", mem.verified_party_id ? `${mem.verified_party_id} via ${mem.verified_fields.join(", ")}` : `no (${mem.verify_failures} failed)`],
    ["Remembered intent", mem.intent || "none"],
    ["Case hints", Object.keys(mem.case_hints).length ? `<span class="tag">${esc(JSON.stringify(mem.case_hints))}</span>` : "none"],
    ["Selected case", mem.selected_case_id || "none"],
    ["Consent", (mem.consent_status || "n/a") + (mem.consent_link && mem.consent_status === "pending"
        ? ` <a href="${mem.consent_link}" target="_blank" style="color:var(--accent)">open policyholder link ↗</a>` : "")],
    ["Address as", mem.address_as || "n/a"],
    ["Off-topic streak", mem.off_topic_streak],
    ["Emotion", mem.emotions.slice(-4).join(" → ") || "n/a"],
    ["Email", mem.email_state],
  ];
  $("memory").innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${typeof v === "string" && (v.startsWith("<") || v.includes("<a ")) ? v : esc(v)}</dd>`).join("");
  if (state.integrations) {
    const i = state.integrations;
    $("integrations").innerHTML = Object.entries(i).map(([k, v]) =>
      `<span class="tag ${["fixtures", "outbox", "scenario"].includes(v) ? "" : "llm"}">${k}: ${v}</span>`).join("");
  }
  if (turn) {
    $("turn").className = "";
    $("turn").innerHTML = `
      <dl>
        <dt>Phase</dt><dd>${turn.phase_before} → ${turn.phase_after}</dd>
        <dt>Plan (acts)</dt><dd><div class="tags">${turn.acts.map(a => `<span class="tag">${a}</span>`).join("")}</div></dd>
        <dt>Understood by</dt><dd><span class="tag ${turn.nlu_source === "llm" ? "llm" : ""}">${esc(turn.nlu_source)}</span></dd>
        <dt>Reply by</dt><dd><span class="tag ${turn.reply_source === "llm" ? "llm" : ""}">${turn.reply_source}</span>
          ${turn.guard_violations.length ? `<span class="tag bad">guard blocked draft</span>` : ""}</dd>
        <dt>Latency</dt><dd>${turn.latency_ms} ms</dd>
      </dl>
      ${turn.trace.length ? `<h2 style="margin-top:10px">Engine trace</h2><ul class="trace">${turn.trace.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
      <details style="margin-top:8px"><summary>Extraction JSON</summary><pre>${esc(JSON.stringify(turn.extraction, null, 2))}</pre></details>`;
  }
  if (mem.email_record) { $("outboxwrap").hidden = false; const e = mem.email_record;
    $("outbox").textContent = `To: ${e.to}\nSubject: ${e.subject}\nSent: ${e.sent_at} (composed by ${e.composed_by})\n\n${e.body}`; }
  else $("outboxwrap").hidden = true;
  if (mem.handoff_note) { $("handoffwrap").hidden = false; $("handoff").textContent = JSON.stringify(mem.handoff_note, null, 2); }
  else $("handoffwrap").hidden = true;
}

async function newSession() {
  const r = await fetch("/api/session", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ api_key: $("apikey").value || null, consent_scenario: $("consent").value }) });
  const s = await r.json(); sid = s.session_id; $("log").innerHTML = "";
  s.history.forEach(h => bubble(h.role, h.text));
  $("turn").className = "empty"; $("turn").textContent = "No turns yet.";
  render(s); $("input").focus();
}

async function send(text) {
  text = (text ?? $("input").value).trim();
  if (!text || busy || !sid) return;
  busy = true; $("send").disabled = true; $("input").value = "";
  bubble("caller", text);
  const t = bubble("agent typing", "…");
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sid, message: text }) });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const { turn, state } = await r.json();
    t.className = "msg agent"; t.textContent = turn.agent;
    render(state, turn);
  } catch (e) { t.className = "msg agent"; t.textContent = "Error: " + e.message; }
  busy = false; $("send").disabled = false; $("input").focus();
  $("log").scrollTop = $("log").scrollHeight;
}

$("chips").innerHTML = SAMPLES.map(([l], i) => `<button class="chip" data-i="${i}" title="${esc(SAMPLES[i][1])}">${esc(l)}</button>`).join("");
$("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) send(SAMPLES[b.dataset.i][1]); });
$("send").onclick = () => send();
$("newbtn").onclick = newSession;
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
// Label the key field with the provider the server is configured for.
fetch("/api/health").then(r => r.json()).then(h => {
  const names = { deepseek: "DeepSeek", anthropic: "Anthropic", claude: "Anthropic", openai: "OpenAI" };
  const name = names[h.provider] || h.provider;
  $("apikey").placeholder = `Optional: your ${name} API key`;
  $("apikey").title = `Paste a ${name} API key to use it for new conversations. `
    + (h.server_key_configured ? "Leave empty to use the key already set on the server." : "No key is set on the server, so without one the bot runs in offline mode.");
});
newSession();
</script>
</body>
</html>
