<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claims Support</title>
<style>
:root {
  --bg: #eef1f6; --card: #ffffff; --text: #1b2230; --muted: #6b7484; --line: #e4e8ee;
  --brand: #1f4fd1; --brand-ink: #ffffff; --brand-soft: #e9effd;
  --bubble: #f2f4f8; --ok: #1c7c49; --ok-soft: #e3f3ea; --warn: #8a5a00; --warn-soft: #fdf3dc;
  --shadow: 0 10px 40px rgba(20, 30, 60, .12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --card: #181c24; --text: #e7e9ee; --muted: #9aa3b2; --line: #2a303b;
    --brand: #6f8fff; --brand-ink: #0f1218; --brand-soft: #222b45;
    --bubble: #222833; --ok: #5fd197; --ok-soft: #1a3226; --warn: #f2c15b; --warn-soft: #382c14;
    --shadow: 0 10px 40px rgba(0, 0, 0, .4);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; overflow-x: hidden;
  display: flex; align-items: center; justify-content: center; }
.card { width: min(720px, 100%); height: min(860px, 100vh); background: var(--card); border-radius: 18px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden; }
header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.logo { width: 40px; height: 40px; border-radius: 12px; background: var(--brand); display: grid; place-items: center; color: var(--brand-ink); flex: none; }
.title { font-weight: 650; font-size: 16px; }
.sub { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.spacer { flex: 1; }
.link { background: none; border: 1px solid var(--line); color: var(--text); font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 999px; cursor: pointer; }
.link:hover { border-color: var(--brand); color: var(--brand); }
#status { display: flex; align-items: center; gap: 8px; padding: 8px 20px; font-size: 13px; border-bottom: 1px solid var(--line); }
#status.verifying, #status.consent { background: var(--warn-soft); color: var(--warn); }
#status.verified { background: var(--ok-soft); color: var(--ok); }
#status.ended, #status.handoff { background: var(--brand-soft); color: var(--brand); }
#log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: flex-end; }
.row.me { justify-content: flex-end; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
.bubble { max-width: 80%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
.bot .bubble { background: var(--bubble); border-bottom-left-radius: 4px; }
.me .bubble { background: var(--brand); color: var(--brand-ink); border-bottom-right-radius: 4px; }
.typing span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
#quick { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 10px; }
#quick button { font: inherit; font-size: 13.5px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--brand); background: var(--card); color: var(--brand); cursor: pointer; }
#quick button:hover { background: var(--brand-soft); }
form { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--line); }
textarea { flex: 1; resize: none; font: inherit; line-height: 1.4; overflow-y: auto; scrollbar-width: none; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); height: 46px; }
textarea:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
.send { border: 0; background: var(--brand); color: var(--brand-ink); width: 46px; border-radius: 12px; cursor: pointer; display: grid; place-items: center; }
.send:disabled, textarea:disabled { opacity: .5; cursor: default; }
#endbar { display: none; padding: 14px 20px 18px; border-top: 1px solid var(--line); text-align: center; }
#endbar button { font: inherit; font-weight: 600; padding: 9px 18px; border-radius: 999px; border: 0; background: var(--brand); color: var(--brand-ink); cursor: pointer; }
.fine { font-size: 11.5px; color: var(--muted); text-align: center; padding: 0 20px 10px; }
@media (max-width: 760px) {
  body { display: block; }
  .card { height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
  header { padding: 12px 16px; }
  #log { padding: 16px; }
  .bubble { max-width: 88%; }
}
</style>
</head>
<body>
<div class="card">
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 9.5-8 11-4.5-1.5-8-6-8-11V5l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
    </div>
    <div>
      <div class="title">Claims Support</div>
      <div class="sub"><span class="dot"></span>Ava, virtual assistant</div>
    </div>
    <span class="spacer"></span>
    <button class="link" id="human" type="button">Talk to a person</button>
  </header>
  <div id="status" class="verifying"></div>
  <div id="log" aria-live="polite"></div>
  <div id="quick"></div>
  <form id="form">
    <textarea id="input" placeholder="Type your message…" aria-label="Message"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </form>
  <div id="endbar"><button id="restart" type="button">Start a new chat</button></div>
  <div class="fine">Ava can help with insurance claims only. Claim details are shared only after identity verification.</div>
</div>
<script>
const LOCK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
const STATUS = {
  verifying: [LOCK, "Secure verification: we'll confirm your identity before sharing any claim details."],
  consent: [LOCK, "Waiting for the policyholder to approve access."],
  verified: [CHECK, "Identity verified. Your claim details are unlocked for this chat."],
  handoff: [CHECK, "You're being connected with a member of our team."],
  ended: [CHECK, "This chat has ended. Thank you for contacting us."],
};
let sid = null, busy = false, done = false;
const $ = (id) => document.getElementById(id);

function add(who, text) {
  const row = document.createElement("div");
  row.className = "row " + who;
  if (who === "bot") row.innerHTML = '<div class="avatar">A</div>';
  const b = document.createElement("div");
  b.className = "bubble"; b.textContent = text;
  row.appendChild(b); $("log").appendChild(row);
  $("log").scrollTop = $("log").scrollHeight;
  return b;
}

function apply(v) {
  const [icon, text] = STATUS[v.status] || STATUS.verifying;
  $("status").className = v.status; $("status").innerHTML = icon + "<span>" + text + "</span>";
  $("quick").innerHTML = "";
  v.quick_replies.forEach(q => {
    const btn = document.createElement("button"); btn.type = "button"; btn.textContent = q;
    btn.onclick = () => send(q); $("quick").appendChild(btn);
  });
  done = v.status === "ended" || v.status === "handoff";
  $("form").style.display = done ? "none" : "flex";
  $("endbar").style.display = done ? "block" : "none";
  $("human").style.display = done ? "none" : "";
}

async function start() {
  $("log").innerHTML = ""; $("quick").innerHTML = "";
  const r = await fetch("/api/client/session", { method: "POST" });
  const v = await r.json(); sid = v.session_id;
  add("bot", v.reply); apply(v); $("input").focus();
}

async function send(text) {
  text = (text ?? $("input").value).trim();
  if (!text || busy || done) return;
  busy = true; $("send").disabled = true; $("input").value = ""; $("quick").innerHTML = "";
  add("me", text);
  const t = add("bot", ""); t.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  try {
    const r = await fetch("/api/client/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sid, message: text }) });
    const v = await r.json();
    if (!r.ok) throw new Error(v.detail || "Something went wrong.");
    t.textContent = v.reply; apply(v);
  } catch (e) { t.textContent = "Sorry, something went wrong on our side. " + e.message; }
  busy = false; $("send").disabled = false; if (!done) $("input").focus();
  $("log").scrollTop = $("log").scrollHeight;
}

$("form").onsubmit = (e) => { e.preventDefault(); send(); };
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("human").onclick = () => send("I'd like to talk to a person, please.");
$("restart").onclick = start;
start();
</script>
</body>
</html>
